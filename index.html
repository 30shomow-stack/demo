<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
        <a-box
            position="0 1 -5"
            depth="2"
            height="2"
            width="2"
            color="tomato"
            animation="
                property: rotation;
                from: 0 0 0;
                to: 0 360 0;
                dur: 8000;
                easing: "easeInOut" ;
                loop: true;
            "
            animation__2="
            property: color;
            from: rgb(255,0,0);
            to: rgb(255,255,0);
            dir: alternate;
            dur: 500;
            loop: true;
            "
            
            animation__3="
            property: position;
            from: 0 1 -5;
            to: 0 5 -5;
            dir: alternate;
            loop: true;
            dur: 200;
            "
            >
        </a-box>
        </a-scene>
    </body>
</html>
